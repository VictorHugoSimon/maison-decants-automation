name: Deploy

on:
  push:
    branches: [staging, main]

# Um deploy por ambiente de cada vez. Nao cancelamos deploys em andamento para
# evitar interromper uma migracao de banco de dados a meio.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # `main` -> production, qualquer outra branch coberta pelo trigger -> staging.
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    env:
      WRANGLER_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --env "$WRANGLER_ENV" --remote

      - name: Deploy
        run: npx wrangler deploy --env "$WRANGLER_ENV"
