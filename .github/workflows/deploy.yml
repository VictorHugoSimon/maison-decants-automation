name: Deploy

on:
  push:
    branches: [staging, main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    env:
      WRANGLER_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WEBHOOK_QUEUE_NAME: ${{ github.ref == 'refs/heads/main' && 'maison-decants-webhooks' || 'maison-decants-webhooks-staging' }}
      WEBHOOK_DLQ_NAME: ${{ github.ref == 'refs/heads/main' && 'maison-decants-webhooks-dlq' || 'maison-decants-webhooks-staging-dlq' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing GitHub secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing GitHub secret CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi

      - name: Ensure webhook queues exist
        shell: bash
        run: |
          npx wrangler queues create "$WEBHOOK_QUEUE_NAME" || echo "Primary queue already exists or will be validated during deploy."
          npx wrangler queues create "$WEBHOOK_DLQ_NAME" || echo "DLQ already exists or will be validated during deploy."

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --env "$WRANGLER_ENV" --remote

      - name: Deploy
        run: npx wrangler deploy --env "$WRANGLER_ENV"
