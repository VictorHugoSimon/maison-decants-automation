name = "maison-decants-automation"
main = "src/index.ts"
compatibility_date = "2026-08-22"

# O bloco de nivel superior e usado por `wrangler dev` e por `wrangler deploy`
# sem `--env`. Ambientes nomeados (staging, production) NAO herdam `vars` nem
# bindings do topo, portanto cada ambiente redeclara os seus explicitamente.
[vars]
APP_NAME = "Maison Decants Automacao"
APP_CONTACT_EMAIL = "victorhugoteixeirasimon@gmail.com"
NUVEMSHOP_API_BASE_URL = "https://api.nuvemshop.com.br/v1"
NUVEMSHOP_OAUTH_TOKEN_URL = "https://www.nuvemshop.com/apps/authorize/token"

[[d1_databases]]
binding = "DB"
database_name = "maison-decants-automation"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# ---------------------------------------------------------------------------
# Staging
# Deploy automatico a partir da branch `staging` (ver .github/workflows/deploy.yml).
# ---------------------------------------------------------------------------
[env.staging]
name = "maison-decants-automation-staging"

[env.staging.vars]
APP_NAME = "Maison Decants Automacao (staging)"
APP_CONTACT_EMAIL = "victorhugoteixeirasimon@gmail.com"
NUVEMSHOP_API_BASE_URL = "https://api.nuvemshop.com.br/v1"
NUVEMSHOP_OAUTH_TOKEN_URL = "https://www.nuvemshop.com/apps/authorize/token"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "maison-decants-automation-staging"
database_id = "REPLACE_WITH_STAGING_D1_DATABASE_ID"

# ---------------------------------------------------------------------------
# Production
# Deploy automatico a partir da branch `main` (ver .github/workflows/deploy.yml).
# ---------------------------------------------------------------------------
[env.production]
name = "maison-decants-automation"

[env.production.vars]
APP_NAME = "Maison Decants Automacao"
APP_CONTACT_EMAIL = "victorhugoteixeirasimon@gmail.com"
NUVEMSHOP_API_BASE_URL = "https://api.nuvemshop.com.br/v1"
NUVEMSHOP_OAUTH_TOKEN_URL = "https://www.nuvemshop.com/apps/authorize/token"

[[env.production.d1_databases]]
binding = "DB"
database_name = "maison-decants-automation"
database_id = "REPLACE_WITH_PRODUCTION_D1_DATABASE_ID"
